name: Weekly Cineville Amsterdam program

on:
  schedule:
    # Tuesday 12:00 Europe/Amsterdam, split into two cron lines because
    # GitHub Actions cron runs in UTC and Amsterdam alternates between
    # CET (UTC+1) and CEST (UTC+2). This is a ~1-week-either-side
    # approximation around the actual DST changeover dates -- see README.
    - cron: "0 10 * 3-10 2"   # CEST months (roughly late Mar - late Oct): 10:00 UTC = 12:00 CEST
    - cron: "0 11 * 1,2,11,12 2"  # CET months (roughly late Oct - late Mar): 11:00 UTC = 12:00 CET
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch program and build page
        run: python scripts/fetch_program.py

      - name: Commit updated docs/ and data/
        run: |
          git config user.name "cineville-tracker-bot"
          git config user.email "actions@users.noreply.github.com"

          # docs/index.html and data/latest.json are fully REGENERATED every
          # run (not incrementally edited), so a rebase/merge against a
          # newer origin/main will almost always hit a content conflict --
          # even just the "generated at" timestamp line differs between any
          # two runs. There's nothing meaningful to merge for these two
          # files: this run's freshly-scraped content should simply win
          # outright. So instead of merging, this commits our generated
          # files, and if the push is rejected as non-fast-forward (e.g.
          # another run or a manual push landed on main first), it moves
          # our commit onto the new tip via `git reset --mixed origin/main`
          # (which re-points the branch at the latest main and syncs the
          # index to it, without touching the working tree) and recommits
          # our same generated file content on top -- retried up to 5 times
          # to absorb any amount of racing. `--mixed` (not `--soft`) is what
          # makes this safe: it means any OTHER file that changed on main
          # in the meantime (e.g. a script edit you pushed) is correctly
          # picked up rather than accidentally reverted by the retry.
          git add docs/index.html data/latest.json

          for attempt in 1 2 3 4 5; do
            if git diff --cached --quiet; then
              echo "No changes to commit"
              break
            fi
            git commit -m "Weekly program update"
            if git push; then
              echo "Pushed successfully"
              break
            fi
            echo "Push rejected (attempt $attempt) -- rebasing our generated content onto the latest main and retrying"
            git fetch origin main
            git reset --mixed origin/main
            git add docs/index.html data/latest.json
          done

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
